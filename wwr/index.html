<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Right Rafting Corp.</title>
    <meta name="description"
      content="This is the about page for the rafting site, containing contact details. ">
    <meta name="author" content="Derek Joseph Temblor">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <!-- logo -->
        <img src="images/z-dryoarlogo.png" alt="rafting site logo">

        <!-- nav -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/adv3.webp" alt="Rafting Background">
            <h1 id="h1about">The Right Rafting Corp.</h1>

        </div>

        <article class="newsletter">
            <h2>Email Newsletter</h2>
            <div class="form-item">
                <label class="text-label" for="fullname">Name:</label>
                <input class="text-input" id="fullname" name="fullname" required>
            </div>
            <div class="form-item">
                <label class="text-label" for="useremail">Email Adress:</label>
                <input class="text-input" type="text" id="useremail" name="useremail" required>
            </div>
            <div>
                <input class="check-input" type="checkbox" name="subscribe" id="subscribe">
                <p class="check-label">Please subscribe me to the
                    monthly newsletter</p>
            </div>
            <div class="form-item">
                <input class="submit-input" type="submit" name="submit" id="submit">
            </div>
            <img src="images/adv2.webp" alt="Bumpy River Rafting">
        </article>

        <article class="call-to-action">
            <h2>Trips</h2>
            <figure>
                <img src="images/rafting26_600.webp" alt="Kayak River Rafting">
                <figcaption><a href="trips.html">Ready to get going? Click here to make a
                        reservation!</a></figcaption>
                <!-- <figcaption>Ready to get going? Click here to make a
                    reservation!</figcaption> -->
            </figure>
            <!-- click here to make your reservations now! -->
        </article>
    </main>


    <footer>
        <p>&copy; 2026 | The Right Rafting Corp. | Derek Joseph Temblor</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook logo"></a>
            <a href="https://x.com"><img src="images/x-bw.svg" alt="Twitter logo"></a>
            <a href="https://linkdin.com"><img src="images/linkedin.svg" alt="Linkdin logo"></a>
        </nav>
    </footer>
</body>

</html>
